<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruity Fruit</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section id="inputSection">
        <form>
            <label for="fruitInput">Enter fruit name</label>
            <input name="fruit" id="fruitInput" type="text" placeholder="e.g. banana" required>
            <button type=submit value="submit"> Submit </button>
        </form>
    </section>

    <section id="fruitSection">
        <ul></ul>
    </section>

    <section id="nutritionSection">
        <p></p>
    </section>
    <section>
        <form id="create-form">
            <input type="text" id="fruitCreate" name="fruit" placeholder="name" required>
            <input type="submit" value="create">

        </form>
        <p id="message"></p>
    </section>
    <section>
        <form id="delete-form">
            <label for="fruitDeletion">Delete a fruit here:</label>
            <input type="text" id="deleteFruit" placeholder="name e.g. apricot">
            <button type=submit value="submit"> Submit </button>
        </form>
        <p id="delete-message"></p>
    </section>
    <section>
        <form id="update-form">
            <label for="fruitPatching">Update a fruit here:</label>
            <input type="text" id="fruitCategory" placeholder="category">
            <input type="text" id="fruitValue" placeholder="value">
            <button type=submit value="submit"> Submit </button>
        </form>

    </section>
        <p id="update-message"></p>
    <section>
        <img id="fruityFooter" src="https://img.freepik.com/premium-photo/different-fruits-isolated-white-background-with-copy-space_88281-2246.jpg?w=1380">
    </section>
</body>

</html>
